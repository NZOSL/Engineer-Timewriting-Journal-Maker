<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Sign in · Engineer Timewriting</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/signin.js"></script>
</head>
<body class="signin-page">
  <main class="signin">
    <div class="brand brand-lg">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="bm-bg" x="2" y="5" width="28" height="25" rx="6"/><path class="bm-line" d="M2 12.5h28"/><path class="bm-pin" d="M10 3v5M22 3v5"/><rect class="bm-cell" x="7" y="16" width="5" height="4" rx="1"/><rect class="bm-cell bm-hot" x="13.5" y="16" width="5" height="4" rx="1"/><rect class="bm-cell" x="20" y="16" width="5" height="4" rx="1"/><rect class="bm-cell" x="7" y="22" width="5" height="4" rx="1"/><rect class="bm-cell" x="13.5" y="22" width="5" height="4" rx="1"/></svg>
      <span>Engineer Timewriting</span>
    </div>
    <form id="signin-form" class="card signin-card" novalidate>
      <h1>Sign in</h1>
      <p class="muted">Fill in your hours for the month. They go into the timewriting journal for Business Central.</p>
      <label class="field">
        <span>Username</span>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" placeholder="e.g. alex.smith" required>
      </label>
      <label class="field">
        <span>Password</span>
        <span class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="peek" class="peek-btn" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="eye" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="eye" cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
          </button>
        </span>
        <small>Forgotten it, or don’t have one? Ask the office.</small>
      </label>
      <label class="check"><input id="remember" type="checkbox"> Keep me signed in on this computer</label>
      <p id="message" class="form-message" role="alert" hidden></p>
      <button id="submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="signin-foot muted">Your hours are kept on this computer as you type, and sent to the office when you press Save.</p>
  </main>
</body>
</html>
