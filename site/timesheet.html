<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Timesheet · Engineer Timewriting</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/timesheet.js"></script>
</head>
<body class="app-page">
  <header class="topbar">
    <a class="brand" href="home.html">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="bm-bg" x="2" y="5" width="28" height="25" rx="6"/><path class="bm-line" d="M2 12.5h28"/><path class="bm-pin" d="M10 3v5M22 3v5"/><rect class="bm-cell" x="7" y="16" width="5" height="4" rx="1"/><rect class="bm-cell bm-hot" x="13.5" y="16" width="5" height="4" rx="1"/><rect class="bm-cell" x="20" y="16" width="5" height="4" rx="1"/><rect class="bm-cell" x="7" y="22" width="5" height="4" rx="1"/><rect class="bm-cell" x="13.5" y="22" width="5" height="4" rx="1"/></svg>
      <span>Engineer Timewriting</span>
    </a>
    <nav class="month-nav" aria-label="Month">
      <button id="prev-month" class="icon-btn" type="button" aria-label="Previous month">‹</button>
      <h1 id="month-label" class="month-label">&nbsp;</h1>
      <button id="next-month" class="icon-btn" type="button" aria-label="Next month">›</button>
    </nav>
    <div class="user">
      <a class="btn btn-sm" href="home.html">My timesheets</a>
      <span id="user-name" class="user-name"></span>
      <a class="btn btn-ghost btn-sm" href="settings.html">Settings</a>
      <a class="btn btn-ghost btn-sm" href="index.html?signout=1">Sign out</a>
    </div>
  </header>

  <main class="app-main">
    <div id="notices" class="notices" aria-live="polite"></div>
    <div id="loading" class="loading">Opening the job list…</div>
    <div id="grid-wrap" class="grid-wrap" hidden></div>
    <p id="meta" class="meta"></p>
  </main>

  <footer id="savebar" class="savebar" hidden>
    <div class="savebar-status"><span id="save-status" class="save-status" aria-live="polite"></span></div>
    <div id="totals" class="savebar-totals"></div>
    <div class="savebar-actions">
      <button id="preview-btn" class="btn" type="button">Journal preview</button>
      <button id="save-btn" class="btn btn-primary" type="button" title="Save (Ctrl+S)">Save</button>
    </div>
  </footer>

  <dialog id="preview" class="dialog dialog-wide" aria-labelledby="preview-title">
    <div class="dialog-head">
      <h2 id="preview-title">Journal preview</h2>
      <button id="preview-close" class="icon-btn" type="button" aria-label="Close">×</button>
    </div>
    <div id="preview-body" class="dialog-body"></div>
  </dialog>

  <ul id="job-options" class="listbox" role="listbox" aria-label="Open jobs" hidden></ul>
</body>
</html>
